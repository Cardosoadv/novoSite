m divórcio, separação, inventário ou outros conflitos familiares;</li><li data-v-9cf16256>Sócios em dissolução de sociedade ou litígios societários;</li><li data-v-9cf16256>Empresas em conflitos comerciais, como cobranças, contratos, propriedade intelectual, etc.;</li><li data-v-9cf16256>Herdeiros em inventário ou partilha de bens;</li><li data-v-9cf16256>Vizinhos em conflitos imobiliários;</li><li data-v-9cf16256>E em qualquer outro tipo de conflito em que as partes desejem uma resolução consensual e pacífica.</li></ul><h2 class="sub-title mt-5" data-v-9cf16256>Nossos serviços em advocacia colaborativa incluem:</h2><ul class="styled-list" data-v-9cf16256><li data-v-9cf16256><strong data-v-9cf16256>Orientação sobre o método da advocacia colaborativa:</strong> Explicamos os princípios, benefícios e etapas do processo de advocacia colaborativa, esclarecendo dúvidas e respondendo perguntas.</li><li data-v-9cf16256><strong data-v-9cf16256>Auxílio na organização das reuniões colaborativas:</strong> Facilitamos a comunicação entre as partes, definimos pautas de discussão, criamos um ambiente seguro e construtivo para o diálogo e a busca por soluções.</li><li data-v-9cf16256><strong data-v-9cf16256>Elaboração de acordos colaborativos:</strong> Redigimos acordos claros, objetivos e abrangentes que atendam às necessidades e interesses de todas as partes envolvidas, assegurando a efetividade e o cumprimento das decisões.</li><li data-v-9cf16256><strong data-v-9cf16256>Mediação e facilitação do diálogo:</strong> Atuamos como mediadores imparciais, ajudando as partes a se comunicarem de forma eficaz, identificarem pontos em comum e construírem soluções criativas em conjunto.</li><li data-v-9cf16256><strong data-v-9cf16256>Negociação de interesses:</strong> Auxiliamos na negociação dos termos do acordo, buscando soluções justas e equitativas para todas as partes, preservando o respeito mútuo e a colaboração.</li><li data-v-9cf16256><strong data-v-9cf16256>Homologação do acordo em juízo:</strong> Providenciamos a homologação do acordo colaborativo em juízo, conferindo-lhe força de título executivo judicial, garantindo sua validade e exigibilidade.</li></ul><h2 class="sub-title mt-5" data-v-9cf16256>Nossos diferenciais:</h2><ul class="styled-list gold-bullet" data-v-9cf16256><li data-v-9cf16256><strong data-v-9cf16256>Equipe especializada:</strong> Contamos com uma equipe de advogados experientes e certificados em advocacia colaborativa, com profundo conhecimento do método e das melhores práticas para resolução de conflitos de forma consensual.</li><li data-v-9cf16256><strong data-v-9cf16256>Abordagem humanizada:</strong> Acreditamos no poder do diálogo e da escuta ativa para a resolução de conflitos. Tratamos cada caso com atenção individualizada, empatia e respeito, buscando soluções que considerem as necessidades e emoções de todas as partes envolvidas.</li><li data-v-9cf16256><strong data-v-9cf16256>Comunicação clara e transparente:</strong> Mantemos as partes informadas sobre o andamento do processo de forma clara, objetiva e transparente, utilizando linguagem acessível e evitando termos jurídicos desnecessários.</li><li data-v-9cf16256><strong data-v-9cf16256>Compromisso com a ética e a qualidade:</strong> Atuamos com ética, profissionalismo e compromisso com a qualidade, buscando sempre a melhor solução para nossos clientes, dentro dos mais altos padrões de conduta.</li><li data-v-9cf16256><strong data-v-9cf16256>Foco em resultados positivos:</strong> Trabalhamos para alcançar acordos colaborativos que atendam às necessidades e interesses de todas as partes envolvidas, restaurando a harmonia, preservando relacionamentos e construindo um futuro mais positivo para todos.</li></ul>`,8),F(`div`,If,[t[1]||=F(`p`,{class:`mb-3`},`Se você busca uma solução pacífica e duradoura para o seu conflito, entre em contato.`,-1),I(o,{to:`/#contato`,class:`btn-gold`},{default:M(()=>[...t[0]||=[L(`Agende uma Consulta`,-1)]]),_:1})])])]),F(`div`,Lf,[F(`a onsensuais. </p><p data-v-9cf16256> Nossa equipe de experientes advogados especializados em advocacia colaborativa está preparada para auxiliar na resolução de diversos tipos de conflitos, desde questões familiares e de sucessões até litígios comerciais e societários, sempre com foco na preservação de relacionamentos e na construção de acordos duradouros. </p><h2 class="sub-title mt-5" data-v-9cf16256>A advocacia colaborativa é ideal para:</h2><ul class="styled-list gold-bullet" data-v-9cf16256><li data-v-9cf16256>Pessoas físicas e casais em divórcio, separação, inventário ou outros conflitos familiares;</li><li data-v-9cf16256>Sócios em dissolução de sociedade ou litígios societários;</li><li data-v-9cf16256>Empresas em conflitos comerciais, como cobranças, contratos, propriedade intelectual, etc.;</li><li data-v-9cf16256>Herdeiros em inventário ou partilha de bens;</li><li data-v-9cf16256>Vizinhos em conflitos imobiliários;</li><li data-v-9cf16256>E em qualquer outro tipo de conflito em que as partes desejem uma resolução consensual e pacífica.</li></ul><h2 class="sub-title mt-5" data-v-9cf16256>Nossos serviços em advocacia colaborativa incluem:</h2><ul class="styled-list" data-v-9cf16256><li data-v-9cf16256><strong data-v-9cf16256>Orientação sobre o método da advocacia colaborativa:</strong> Explicamos os princípios, benefícios e etapas do processo de advocacia colaborativa, esclarecendo dúvidas e respondendo perguntas.</li><li data-v-9cf16256><strong data-v-9cf16256>Auxílio na organização das reuniões colaborativas:</strong> Facilitamos a comunicação entre as partes, definimos pautas de discussão, criamos um ambiente seguro e construtivo para o diálogo e a busca por soluções.</li><li data-v-9cf16256><strong data-v-9cf16256>Elaboração de acordos colaborativos:</strong> Redigimos acordos claros, objetivos e abrangentes que atendam às necessidades e interesses de todas as partes envolvidas, assegurando a efetividade e o cumprimento das decisões.</li><li data-v-9cf16256><strong data-v-9cf16256>Mediação e facilitação do diálogo:</strong> Atuamos como mediadores imparciais, ajudando as partes a se comunicarem de forma eficaz, identificarem pontos em comum e construírem soluções criativas em conjunto.</li><li data-v-9cf16256><strong data-v-9cf16256>Negociação de interesses:</strong> Auxiliamos na negociação dos termos do acordo, buscando soluções justas e equitativas para todas as partes, preservando o respeito mútuo e a colaboração.</li><li data-v-9cf16256><strong data-v-9cf16256>Homologação do acordo em juízo:</strong> Providenciamos a homologação do acordo colaborativo em juízo, conferindo-lhe força de título executivo judicial, garantindo sua validade e exigibilidade.</li></ul><h2 class="sub-title mt-5" data-v-9cf16256>Nossos diferenciais:</h2><ul class="styled-list gold-bullet" data-v-9cf16256><li data-v-9cf16256><strong data-v-9cf16256>Equipe especializada:</strong> Contamos com uma equipe de advogados experientes e certificados em advocacia colaborativa, com profundo conhecimento do método e das melhores práticas para resolução de conflitos de forma consensual.</li><li data-v-9cf16256><strong data-v-9cf16256>Abordagem humanizada:</strong> Acreditamos no poder do diálogo e da escuta ativa para a resolução de conflitos. Tratamos cada caso com atenção individualizada, empatia e respeito, buscando soluções que considerem as necessidades e emoções de todas as partes envolvidas.</li><li data-v-9cf16256><strong data-v-9cf16256>Comunicação clara e transparente:</strong> Mantemos as partes informadas sobre o andamento do processo de forma clara, objetiva e transparente, utilizando linguagem acessível e evitando termos jurídicos desnecessários.</li><li data-v-9cf16256><strong data-v-9cf16256>Compromisso com a ética e a qualidade:</strong> Atuamos com ética, profissionalismo e compromisso com a qualidade, buscando sempre a melhor solução para nossos clientes, dentro dos mais altos padrões de conduta.</li><li data-v-9cf16256><strong d
